name: Build Specific SukiSU Version

on:
  workflow_call:
    inputs:
      target_version:
        required: true
        type: string
        description: "The target SukiSU version to build (e.g., 40167)"

jobs:
  build-sukisu:
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 准备构建环境
        run: |
          echo "目标版本: ${{ inputs.target_version }}"
          
      - name: 📦 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            openjdk-17-jdk \
            git \
            curl \
            unzip \
            wget \
            zip
        
      - name: 🔧 设置Java环境
        run: |
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV
          echo "PATH=$JAVA_HOME/bin:$PATH" >> $GITHUB_ENV
      
      - name: 📥 克隆SukiSU仓库
        run: |
          git clone https://github.com/SukiSU-Ultra/SukiSU-Ultra.git suksiu-repo
          cd suksiu-repo
          
          # 目标版本40167对应的git count
          TARGET_VERSION="${{ inputs.target_version }}"
          TARGET_GIT_COUNT=$((TARGET_VERSION - 40000 + 2815))
          echo "目标版本: $TARGET_VERSION"
          echo "目标git count: $TARGET_GIT_COUNT"
          
          # 获取所有提交
          ALL_COMMITS=$(git rev-list --reverse HEAD)
          TOTAL_COMMITS=$(git rev-list --count HEAD)
          echo "总提交数: $TOTAL_COMMITS"
          
          # 获取第TARGET_GIT_COUNT个提交
          if [ $TARGET_GIT_COUNT -le $TOTAL_COMMITS ] && [ $TARGET_GIT_COUNT -gt 0 ]; then
            TARGET_COMMIT=$(echo "$ALL_COMMITS" | sed -n "${TARGET_GIT_COUNT}p")
            echo "切换到目标提交: ${TARGET_COMMIT:0:8}"
            git checkout $TARGET_COMMIT
            
            # 验证版本
            CURRENT_GIT_COUNT=$(git rev-list --count HEAD)
            CALCULATED_VERSION=$((40000 + CURRENT_GIT_COUNT - 2815))
            echo "当前提交数: $CURRENT_GIT_COUNT"
            echo "计算版本: $CALCULATED_VERSION"
            
            if [ "$CALCULATED_VERSION" = "$TARGET_VERSION" ]; then
              echo "✅ 版本验证通过: $TARGET_VERSION"
              echo "VERSION_MATCH=true" >> $GITHUB_ENV
            else
              echo "❌ 版本不匹配: 期望 $TARGET_VERSION, 实际 $CALCULATED_VERSION"
              echo "VERSION_MATCH=false" >> $GITHUB_ENV
            fi
          else
            echo "❌ 目标git count无效: $TARGET_GIT_COUNT"
            echo "最大有效git count: $TOTAL_COMMITS"
            echo "VERSION_MATCH=false" >> $GITHUB_ENV
          fi
          
          cd ..
      
      - name: 🏗️ 构建管理器APK
        if: env.VERSION_MATCH == 'true'
        run: |
          cd suksiu-repo
          
          # 检查项目结构
          echo "项目结构:"
          ls -la
          
          # 检查是否有gradle文件
          if [ -f "gradlew" ]; then
            echo "找到gradlew，准备构建..."
            
            # 给gradlew执行权限
            chmod +x gradlew
            
            # 检查可用任务
            echo "可用Gradle任务:"
            ./gradlew tasks --all || true
            
            # 尝试构建
            echo "开始构建..."
            
            # 方法1: 尝试构建manager模块
            if [ -d "manager" ]; then
              echo "构建manager模块..."
              ./gradlew :manager:assembleRelease || ./gradlew :app:assembleRelease || ./gradlew assembleRelease
            else
              # 方法2: 尝试构建整个项目
              echo "构建整个项目..."
              ./gradlew assembleRelease
            fi
            
            # 查找生成的APK文件
            echo "查找生成的APK文件..."
            find . -name "*.apk" -type f | while read apk; do
              echo "找到APK: $apk"
              APK_NAME=$(basename "$apk")
              
              # 检查是否是release版本
              if [[ "$APK_NAME" =~ release|Release ]]; then
                echo "✅ 找到Release APK: $apk"
                # 复制到工作目录
                cp "$apk" "../SukiSU-管理器-${{ inputs.target_version }}.apk"
                echo "APK_COPIED=true" >> $GITHUB_ENV
              fi
            done
          else
            echo "❌ 未找到gradlew，可能是非标准项目结构"
            echo "项目内容:"
            find . -type f -name "*.gradle" -o -name "*.kts" | head -20
          fi
          
          cd ..
      
      - name: 📱 备选方案：直接使用预编译版本
        if: env.VERSION_MATCH != 'true' || env.APK_COPIED != 'true'
        run: |
          echo "⚠ 无法构建指定版本，尝试其他方法..."
          
          # 方法1: 查看是否有可用的release
          echo "检查GitHub Releases..."
          RELEASES=$(curl -s "https://api.github.com/repos/SukiSU-Ultra/SukiSU-Ultra/releases")
          
          # 查找包含版本号的release
          RELEASE_TAG=$(echo "$RELEASES" | jq -r '.[].tag_name' | grep -i "${{ inputs.target_version }}" | head -1)
          
          if [ -n "$RELEASE_TAG" ]; then
            echo "找到Release标签: $RELEASE_TAG"
            RELEASE_URL="https://github.com/SukiSU-Ultra/SukiSU-Ultra/releases/download/$RELEASE_TAG"
            
            # 尝试下载常见的APK文件名
            for apk_name in "manager.apk" "app-release.apk" "KernelSU.apk" "SukiSU.apk"; do
              if curl -I -f "${RELEASE_URL}/${apk_name}" 2>/dev/null | head -1 | grep -q "200"; then
                echo "下载APK: ${RELEASE_URL}/${apk_name}"
                curl -L -o "SukiSU-管理器-${{ inputs.target_version }}.apk" "${RELEASE_URL}/${apk_name}"
                echo "DOWNLOADED=true" >> $GITHUB_ENV
                break
              fi
            done
          fi
          
          if [ "$DOWNLOADED" != "true" ]; then
            echo "❌ 无法获取指定版本的APK"
            echo "TARGET_VERSION=${{ inputs.target_version }}" >> $GITHUB_ENV
          fi
      
      - name: 📤 上传构建产物
        if: env.APK_COPIED == 'true' || env.DOWNLOADED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU-Manager-${{ inputs.target_version }}
          path: |
            *.apk
      
      - name: ⚠️ 构建失败通知
        if: failure()
        run: |
          echo "❌ 构建指定版本 ${{ inputs.target_version }} 失败"
          echo "可能原因:"
          echo "1. 版本号无效"
          echo "2. 项目结构变化"
          echo "3. 构建依赖缺失"
          echo "4. 该版本可能从未发布"
          
          # 显示当前最新的版本信息
          cd suksiu-repo 2>/dev/null && git checkout main 2>/dev/null || git checkout master 2>/dev/null
          LATEST_GIT_COUNT=$(git rev-list --count HEAD 2>/dev/null || echo "unknown")
          LATEST_VERSION=$((40000 + LATEST_GIT_COUNT - 2815)) 2>/dev/null || LATEST_VERSION="unknown"
          echo "当前最新版本: $LATEST_VERSION (git count: $LATEST_GIT_COUNT)"
