name: GetManager
permissions:
  contents: write  # Allow writing to repository contents (for pushing tags)
  actions: read   # Allows triggering actions

on:
  workflow_call: # This allows this workflow to be called from another workflow
    inputs:
      kernelsu_variant:
        required: true
        type: string
    outputs:
      susVer:
        description: "The fetched SUSFS version number"
        value: ${{ jobs.get_ksu_manager.outputs.susVer }}

      ksuVer:
        description: "The calculated KSU version number"
        value: ${{ jobs.get_ksu_manager.outputs.ksuVer }}

jobs:
  get_ksu_manager:
    runs-on: ubuntu-latest
    outputs:
      # 输出1: KSU版本号
      ksuVer: ${{ steps.get_version.outputs.kversion }}
      # 输出2: SUSFS版本号
      susVer: ${{ steps.get_version.outputs.sversion }}
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: 🧐 Debug Workflow Caller Context
        run: |
          echo "==================== DEBUG CONTEXT ===================="
          echo " "
          echo "EVENT NAME: ${{ github.event_name }}"
          echo " "
          echo "--- CALLER INFORMATION ---"
          echo "  - Caller Repository: ${{ github.caller_repository }}"
          echo "  - Caller Workflow:   ${{ github.caller_workflow }}"
          echo "  - Caller User:       ${{ github.triggering_actor }}"
          echo " "
          echo "--- WORKFLOW & JOB INFORMATION ---"
          echo "  - Current Workflow:  ${{ github.workflow }}"
          echo "  - Current Job ID:    ${{ github.job }}"
          echo "  - Current Run ID:    ${{ github.run_id }}"
          echo "  - Current Run Number:${{ github.run_number }}"
          echo " "
          echo "--- GIT REFERENCE INFORMATION ---"
          echo "  - Git Ref:           ${{ github.ref }}"
          echo "  - Ref Type:          ${{ github.ref_type }}"
          echo " "
          echo "======================================================="
          
      - name: 安装依赖
        run: sudo apt install -y git curl jq

      # 修改步骤：获取 KSU & SUSFS 版本
      - name: 获取 KSU & SUSFS 版本
        id: get_version
        run: |
          if [ "${{ inputs.kernelsu_variant }}" == "Next" ]; then
            echo "This is the Next variant"
            git clone https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU
          elif [ "${{ inputs.kernelsu_variant }}" == "SukiSU" ]; then
            echo "This is the SukiSU variant"
            git clone https://github.com/SukiSU-Ultra/SukiSU-Ultra.git KernelSU
            cd KernelSU
            TARGET_GIT_COUNT=$((40167 - 40000 + 2815))
            TARGET_COMMIT=$(git rev-list HEAD --reverse | sed -n "${TARGET_GIT_COUNT}p")
      
            if [ -n "$TARGET_COMMIT" ]; then
              echo "切换到提交: $TARGET_COMMIT"
              git checkout $TARGET_COMMIT
            else
              echo "警告：未找到对应40167版本的提交，使用最新版本"
            fi
      
            cd ..
          elif [ "${{ inputs.kernelsu_variant }}" == "Official" ]; then
            echo "This is the Official"
            git clone https://github.com/tiann/KernelSU.git KernelSU
          elif [ "${{ inputs.kernelsu_variant }}" == "MKSU" ]; then
            echo "This is the Official"
            git clone https://github.com/5ec1cff/KernelSU.git KernelSU    
          else
            echo "Unknown variant"
          fi

          VAR=$([[ "${{ inputs.kernelsu_variant }}" == "SukiSU" ]] && echo 700 || echo 200)

          cd KernelSU

          # 计算KSU版本号
          KSU_GIT_VERSION=$(git rev-list --count HEAD)
          KSU_VERSION=$((10000 + KSU_GIT_VERSION + VAR))
          if [ "${{ inputs.kernelsu_variant }}" == "SukiSU" ]; then
            KSU_VERSION=$((40000 + KSU_GIT_VERSION - 2815))
          elif [ "${{ inputs.kernelsu_variant }}" == "Official" ]; then
            KSU_VERSION=$((20000 + KSU_GIT_VERSION))
          fi
    
          echo "当前版本: $KSU_VERSION"
          echo "KSU_VERSION=$KSU_VERSION" >> $GITHUB_ENV

          # 计算SUSFS版本号
          INFO="https://gitlab.com/simonpunk/susfs4ksu/-/raw/gki-android14-6.1/ksu_module_susfs/module.prop\?ref_type\=heads"
          SUS_VERSION=$(curl -s $INFO | awk -F '=' '$1 == "version" { print $2 }')
          echo $SUS_VERSION

          # 导出这两个值给release
          echo "kversion=$KSU_VERSION" >> $GITHUB_OUTPUT
          echo "sversion=$SUS_VERSION" >> $GITHUB_OUTPUT
      - name: 添加 KernelSU
        id: add_KSU
        continue-on-error: true
        run: |
          if [ "${{ inputs.kernelsu_variant }}" == "Next" ]; then
            echo "KernelSU Next..."
            REPO="KernelSU-Next/KernelSU-Next"
          elif [ "${{ inputs.kernelsu_variant }}" == "SukiSU" ]; then
            echo "SukiSU..."
            REPO="SukiSU-Ultra/SukiSU-Ultra"
            
            # 获取当前checkout的commit哈希
            cd KernelSU
            CURRENT_COMMIT=$(git rev-parse HEAD)
            CURRENT_VERSION=$((40000 + $(git rev-list --count HEAD) - 2815))
            echo "当前commit: $CURRENT_COMMIT"
            echo "计算版本: $CURRENT_VERSION"
            cd ..
          elif [ "${{ inputs.kernelsu_variant }}" == "MKSU" ]; then
            echo "MKSU..."
            REPO="5ec1cff/KernelSU"
          elif [ "${{ inputs.kernelsu_variant }}" == "Official" ]; then
            echo "KSU..."
            REPO="tiann/KernelSU"
          fi
      
          FILENAME=$([[ "${{ inputs.kernelsu_variant }}" == "Next" ]] && echo "build-manager-ci.yml" || echo "build-manager.yml")
          KSUM="Manager"
          
          # 初始化变量
          PAGE=1
          PER_PAGE=100  # GitHub API每页最大100条
          MAX_PAGES=9   # 最多查9页 = 900条记录
          FOUND_BUILD=0
          DOWNLOAD_URL=""
          TARGET_SHA=""
          MATCHING_BUILD_ID=""
      
          echo "开始查找包含 'manager' 产物的构建..."
          echo "将搜索最多 ${MAX_PAGES} 页，每页 ${PER_PAGE} 条记录，共最多 ${MAX_PAGES}00 条记录"
          
          # 如果指定了force_version，优先使用版本匹配
          FORCE_VERSION="${{ inputs.force_version }}"
          if [ -n "$FORCE_VERSION" ] && [ "${{ inputs.kernelsu_variant }}" == "SukiSU" ]; then
            echo "强制查找版本: $FORCE_VERSION"
            TARGET_GIT_COUNT=$((FORCE_VERSION - 40000 + 2815))
            echo "目标提交数: $TARGET_GIT_COUNT"
          fi
      
          # 循环遍历多个API页面
          while [ $PAGE -le $MAX_PAGES ] && [ $FOUND_BUILD -eq 0 ]; do
            echo "=================================================="
            echo "正在搜索第 ${PAGE} 页 (记录 ${(( (PAGE-1)*PER_PAGE+1 ))} - $(( PAGE*PER_PAGE )) )..."
            
            # 获取当前页的成功构建
            API_URL="https://api.github.com/repos/$REPO/actions/workflows/$FILENAME/runs?status=success&per_page=$PER_PAGE&page=$PAGE"
            echo "API URL: $API_URL"
            
            RESPONSE=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              "$API_URL")
            
            # 检查响应是否有效
            if echo "$RESPONSE" | jq -e '.workflow_runs' > /dev/null 2>&1; then
              TOTAL_BUILDS=$(echo "$RESPONSE" | jq '.workflow_runs | length')
              echo "本页找到 $TOTAL_BUILDS 个成功构建"
              
              if [ $TOTAL_BUILDS -eq 0 ]; then
                echo "第 $PAGE 页没有更多构建记录"
                break
              fi
              
              # 遍历当前页的每个构建
              for i in $(seq 0 $((TOTAL_BUILDS-1))); do
                echo "--------------------------------------------------"
                BUILD_ID=$(echo "$RESPONSE" | jq -r ".workflow_runs[$i].id")
                BUILD_SHA=$(echo "$RESPONSE" | jq -r ".workflow_runs[$i].head_sha")
                BUILD_CREATED=$(echo "$RESPONSE" | jq -r ".workflow_runs[$i].created_at")
                RUN_NUMBER=$(echo "$RESPONSE" | jq -r ".workflow_runs[$i].run_number")
                
                echo "构建 #${RUN_NUMBER} | ID: ${BUILD_ID} | 创建时间: ${BUILD_CREATED}"
                echo "构建对应commit: ${BUILD_SHA:0:8}"
                
                # 检查commit匹配
                if [ "${{ inputs.kernelsu_variant }}" == "SukiSU" ] && [ -n "$CURRENT_COMMIT" ]; then
                  if [ "$BUILD_SHA" = "$CURRENT_COMMIT" ]; then
                    echo "✓ 找到精确commit匹配的构建！"
                    FOUND_BUILD=1
                    MATCHING_BUILD_ID=$BUILD_ID
                    break 2  # 跳出两层循环
                  fi
                  
                  # 备选方案：如果commit不完全匹配，检查是否为同一版本
                  # 获取构建对应的git count
                  BUILD_GIT_COUNT=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                    "https://api.github.com/repos/$REPO/commits/$BUILD_SHA" | \
                    jq -r '.commit.message' | grep -o "\[KernelSU Manager CI\] #[0-9]*" | grep -o "[0-9]*" || echo "")
                  
                  if [ -n "$BUILD_GIT_COUNT" ]; then
                    BUILD_VERSION=$((40000 + BUILD_GIT_COUNT - 2815))
                    echo "构建版本计算: $BUILD_VERSION (git count: $BUILD_GIT_COUNT)"
                    
                    if [ "$BUILD_VERSION" = "$CURRENT_VERSION" ]; then
                      echo "✓ 找到版本匹配的构建！(版本: $BUILD_VERSION)"
                      FOUND_BUILD=1
                      MATCHING_BUILD_ID=$BUILD_ID
                      break 2
                    fi
                    
                    # 如果指定了force_version，检查是否匹配
                    if [ -n "$FORCE_VERSION" ] && [ "$BUILD_VERSION" = "$FORCE_VERSION" ]; then
                      echo "✓ 找到强制版本匹配的构建！(版本: $FORCE_VERSION)"
                      FOUND_BUILD=1
                      MATCHING_BUILD_ID=$BUILD_ID
                      break 2
                    fi
                  fi
                fi
                
                # 对于非SukiSU变种或其他情况，查找包含Manager的构建
                ARTIFACTS_RESPONSE=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                  "https://api.github.com/repos/$REPO/actions/runs/$BUILD_ID/artifacts")
                
                HAS_MANAGER=$(echo "$ARTIFACTS_RESPONSE" | jq -r '.artifacts[] | select(.name | contains("Manager")) | .name' | head -1)
                
                if [ -n "$HAS_MANAGER" ]; then
                  echo "找到Manager产物: $HAS_MANAGER"
                  
                  # 对于非SukiSU或没有指定commit的情况，使用第一个找到的Manager构建
                  if [ "${{ inputs.kernelsu_variant }}" != "SukiSU" ] || [ -z "$CURRENT_COMMIT" ]; then
                    echo "使用找到的Manager构建"
                    FOUND_BUILD=1
                    MATCHING_BUILD_ID=$BUILD_ID
                    break 2
                  fi
                else
                  echo "没有Manager产物"
                fi
              done
            else
              echo "第 $PAGE 页API响应无效或已无数据"
              break
            fi
            
            PAGE=$((PAGE + 1))
            # 添加延迟避免GitHub API限速
            sleep 1
          done
          
          echo "=================================================="
          
          # 如果找到了匹配的构建
          if [ $FOUND_BUILD -eq 1 ] && [ -n "$MATCHING_BUILD_ID" ]; then
            echo "找到匹配的构建ID: $MATCHING_BUILD_ID"
            
            # 获取构建产物
            ARTIFACTS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/$REPO/actions/runs/$MATCHING_BUILD_ID/artifacts")
            
            # 查找Manager产物
            MANAGER_ARTIFACT_NAME=$(echo "$ARTIFACTS" | jq -r '.artifacts[] | select(.name | contains("Manager")) | .name' | head -1)
            DOWNLOAD_URL=$(echo "$ARTIFACTS" | jq -r '.artifacts[] | select(.name | contains("Manager")) | .archive_download_url' | head -1)
            
            if [ -n "$DOWNLOAD_URL" ]; then
              echo "找到Manager产物下载链接"
              echo "产物名称: $MANAGER_ARTIFACT_NAME"
            else
              echo "构建存在但没有找到Manager下载链接"
            fi
          else
            echo "在 ${MAX_PAGES}00 条记录中未找到匹配的构建"
            echo "将尝试下载最新构建作为备选"
            
            # 备选方案：下载最新构建
            LATEST_BUILD=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/$REPO/actions/workflows/$FILENAME/runs?status=success&per_page=1" |
              jq -r '.workflow_runs[0].id')
            
            if [ -n "$LATEST_BUILD" ] && [ "$LATEST_BUILD" != "null" ]; then
              echo "使用最新构建ID: $LATEST_BUILD"
              MATCHING_BUILD_ID=$LATEST_BUILD
              
              ARTIFACTS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                "https://api.github.com/repos/$REPO/actions/runs/$LATEST_BUILD/artifacts")
              
              DOWNLOAD_URL=$(echo "$ARTIFACTS" | jq -r '.artifacts[] | select(.name | contains("Manager")) | .archive_download_url' | head -1)
            fi
          fi
          
          # 下载 Manager 文件
          if [ -n "$DOWNLOAD_URL" ]; then
            FILENAME="${{ inputs.kernelsu_variant }}-管理器(${{ env.KSU_VERSION }}).zip"
            curl -L -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -o "$FILENAME" "$DOWNLOAD_URL"
            echo "Manager 文件已下载为：$FILENAME"
            
            # 验证文件大小
            FILE_SIZE=$(stat -c%s "$FILENAME" 2>/dev/null || stat -f%z "$FILENAME" 2>/dev/null || echo "0")
            if [ "$FILE_SIZE" -gt 1000 ]; then
              echo "文件大小: $((FILE_SIZE/1024)) KB，解压..."
              unzip -q "$FILENAME" || echo "解压失败，但继续执行"
              rm -f "$FILENAME"
            else
              echo "警告：下载的文件可能无效（大小: $FILE_SIZE 字节）"
            fi
          else
            echo "错误：无法下载Manager文件"
            echo "可能的原因："
            echo "1. 没有成功的构建"
            echo "2. 构建产物已过期（GitHub只保留90天）"
            echo "3. API限流或权限问题"
            exit 1
          fi

      - name: 添加 SUSFS 模块
        id: add_SUSFS
        continue-on-error: true
        run: |
          BUILD_ID=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          "https://api.github.com/repos/sidex15/susfs4ksu-module/actions/workflows/build.yml/runs?status=success" |
          jq -r '.workflow_runs[0].id')

          ARTIFACTS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          "https://api.github.com/repos/sidex15/susfs4ksu-module/actions/runs/$BUILD_ID/artifacts")

          DOWNLOAD_URL=$(echo "$ARTIFACTS" | jq -r '.artifacts[0].archive_download_url') 

          NAME=$(echo "$ARTIFACTS" | jq -r '.artifacts[0].name')
          echo "SUSFS_NAME=$NAME" >> $GITHUB_ENV
          NAME="susfs-$NAME.zip"
          
          echo $DOWNLOAD_URL
          echo $NAME
          # 下载 Manager 文件
          curl -L -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -o "$NAME" "$DOWNLOAD_URL"
          echo "$NAME 文件已下载.zip"
          
          
          echo "正在检查调用者: ${{ github.caller_workflow }}"

          # 由用户调用或是由作者上传到release?

          if [ "${{ github.workflow }}" == "测试发布" ]; then
            echo "这是测试发布工作流"
            mkdir -p susfs-module && mv $NAME susfs-module
          else
            echo "这是其他工作流"
            mkdir -p susfs-module && unzip *.zip -d susfs-module
          fi

      - name: Notify on failure
        if: steps.add_KSU.outcome == 'failure'
        run: echo "下载CI构建的KSU失败!"

      - name: 上传APK
        if: steps.add_KSU.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.kernelsu_variant }}-Manager(${{ env.KSU_VERSION }})
          path: |
            *.apk

      - name: 上传SUSFS模块
        if: steps.add_SUSFS.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: susfs-${{ env.SUSFS_NAME }}
          path: ./susfs-module/*
